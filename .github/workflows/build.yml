name: Build Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: gradle dependencies --no-daemon -q

      - name: Build HuHoBot stub
        run: |
          PAPER_API=$(find ~/.gradle -path "*/paper-api-*.jar" ! -name "*-sources*" ! -name "*-javadoc*" | head -1)
          echo "Paper API: $PAPER_API"
          curl -sL -o fastjson2.jar https://repo1.maven.org/maven2/com/alibaba/fastjson2/fastjson2/2.0.53/fastjson2-2.0.53.jar
          mkdir -p libs stub_out
          javac -cp "$PAPER_API:fastjson2.jar" stub/cn/huohuas001/huhobot/spigot/api/BotCustomCommand.java -d stub_out
          cd stub_out
          jar cf ../libs/HuHoBot-Spigot.jar cn/

      - name: Build
        run: gradle jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuHoSTDWhiteList
          path: build/libs/HuHoSTDWhiteList.jar