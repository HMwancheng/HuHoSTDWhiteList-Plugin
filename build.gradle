plugins {
    id 'java'
}

group = 'com.stoopad'
version = '2.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'com.alibaba.fastjson2:fastjson2:2.0.53'
    compileOnly files('libs/HuHoBot-Spigot.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveFileName = 'HuHoSTDWhiteList.jar'
}

task resolvePaperApi {
    doLast {
        def jar = configurations.compileClasspath.files.find { it.name.startsWith('paper-api') }
        if (jar != null) {
            println jar.absolutePath
        } else {
            throw new GradleException('paper-api jar not found in compileClasspath')
        }
    }
}