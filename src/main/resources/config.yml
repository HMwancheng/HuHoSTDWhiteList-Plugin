# QQWhitelist 配置文件

# QQ群绑定命令名（玩家在QQ群发送的命令）
bind-command: "验证码"

# 通信模式（三选一）：
#   huhobot   = 本地安装 HuHoBot 或 HuHoBotPenguin Spigot 版，通过 BotCustomCommand 事件通信
#   rcadapter = 使用 GroupRCAdapter（插件文件: RCHuHoBot-x.x.x-Spigot.jar），通过 Redis 控制台命令通信
#               启动日志示例:
#                 [RCSpigotAdapter] Enabling RCSpigotAdapter v1.0.0
#                 [RCSpigotAdapter] Successfully connected to Redis at 127.0.0.1:6379
#                 [RCSpigotAdapter] Subscribed to Redis channel: HuHoBotChannel
#               status 命令日志示例:
#                 === HuHoBot Status ===
#                 Server Name: survival
#                 Redis Status: Connected
#                 Subscriber Status: Running
#                 Command Channel: HuHoBotChannel
#                 Callback Channel: HuHoBotChannel_callback
#   velocity  = 使用 HuHoSTDWhiteList-Velocity 配套插件，通过 PluginMessage 通道通信
require: rcadapter

# === 验证模式 ===
# "countdown" = 玩家进服后倒计时，期间可绑定，超时踢出
# "prelogin"   = 玩家在连接界面直接被拒绝（看不到游戏画面）
verify-mode: "countdown"

# 倒计时秒数（verify-mode: countdown 时生效）
countdown-seconds: 15

# 倒计时期间冻结玩家（无法移动）
countdown-freeze: true

# 倒计时 BossBar 提示（{time}=剩余秒数, {code}=验证码, {cmd}=绑定命令）
countdown-bar: "§e请在QQ群 @HuHoBot /{cmd} {code}  §c{time}秒后踢出"

# === 白名单绕过 ===
# 名单绕过开关（支持通配符 * 和 ?）
bypass-names-enabled: false
# 白名单玩家名，匹配的玩家直接放行，无需QQ验证
# * 匹配任意多个字符，? 匹配单个字符
bypass-names:
  - "Bot_*"
  - "NPC_*"

# 权限绕过开关（仅 countdown 模式生效，prelogin 模式不支持权限检查）
bypass-permission-enabled: false
# 拥有此权限的玩家直接放行
bypass-permission: "huhostdwhitelist.bypass"

# 单个QQ最多绑定账号数量
max-accounts-per-qq: 1

# 验证码长度
code-length: 6

# 验证码有效期（秒）
code-expiry-seconds: 300

# 踢出提示消息（倒计时结束 / prelogin 模式通用）
# {code} = 验证码，{cmd} = 绑定命令名
kick-message: "§c你尚未绑定QQ！§e请在QQ群 @HuHoBot /{cmd} {code}"

# 绑定过期重新验证（false=永不过期）
rebind-enabled: false

# 过期天数（rebind-enabled: true 时生效）
rebind-days: 30

# 过期踢出提示
rebind-kick-message: "§c绑定已过期！§e请在QQ群 @HuHoBot /{cmd} {code} 重新绑定"

# 回报消息（{player}=用户名, {max}=绑定上限）
# 注意：QQ群不支持 § 颜色代码，请使用纯文本
# prefix 是所有消息的共同前缀，设为空字符串 "" 可去掉前缀
messages:
  # 消息前缀（HuHoBot 会自动添加 §c[绑定] 前缀，此处可自定义后续文字）
  prefix: ""
  # 无参数时提示
  usage: "用法: /验证码 <验证码>"
  # 验证码不存在或已过期
  invalid-code: "验证码无效或已过期"
  # QQ绑定数量已达上限
  bind-limit: "绑定上限（最多{max}个）"
  # 玩家已被其他QQ绑定
  already-bound: "{player} 已绑定"
  # 绑定成功
  success: "{player} 绑定成功，已加白名单"
  # 绑定失败（通用）
  bind-fail: "绑定失败，请重试"